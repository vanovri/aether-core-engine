[package]
name = "aether_core_engine"
version = "1.0.0"
edition = "2024"
description = "Zero-dependency multithreaded 3D spectral path tracer, 3D Navier-Stokes fluid solver, and procedural 24-bit spatial audio engine"

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
